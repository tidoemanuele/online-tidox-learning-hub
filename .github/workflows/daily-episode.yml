name: Daily Episode

on:
  # Scheduled run RETIRED 2026-07-21: learn-2026 (local, 06:15) is the sole daily
  # engine and publishes the hub via publish.sh. This cloud Action was racing it
  # and overwriting the richer local episode. Kept as manual-only fallback.
  workflow_dispatch:
    inputs:
      date:
        description: 'Episode date (YYYY-MM-DD, defaults to today)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Determine date
        id: date
        env:
          INPUT_DATE: ${{ inputs.date }}
        run: |
          if [ -n "$INPUT_DATE" ]; then
            echo "date=$INPUT_DATE" >> "$GITHUB_OUTPUT"
          else
            echo "date=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch source data (if not already committed by local pipeline)
        env:
          EPISODE_DATE: ${{ steps.date.outputs.date }}
        run: |
          if ls "research/$EPISODE_DATE/scraped/"*.json >/dev/null 2>&1; then
            echo "Scraped data already present for $EPISODE_DATE — skipping fetch"
          else
            npx tsx scripts/refresh-scraped.ts "$EPISODE_DATE"
          fi

      - name: Generate episode
        env:
          EPISODE_DATE: ${{ steps.date.outputs.date }}
        run: npx tsx scripts/scrape-to-props.ts "$EPISODE_DATE"

      - name: Build site
        run: npm run build

      - name: Commit and push episode
        env:
          EPISODE_DATE: ${{ steps.date.outputs.date }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage first: `git diff --quiet` ignores untracked files, and a new
          # episode JSON is always untracked
          git add src/content/episodes/ research/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "episode: ${EPISODE_DATE} daily intelligence brief"
          git pull --rebase origin master
          git push
